<svg xmlns="http://www.w3.org/2000/svg" aria-label="Terrace water plan" id="siteTerr" role="img" viewBox="0 0 1000 440"><style>
/* Layout: drawing set — title block, phase tracker, one sheet per flat plan, then schedules, areas and Vastu sign-off. */
:root{
  --bg:#f6f7f8; --sheet:#ffffff; --ink:#1d2730; --muted:#5d6b77; --rule:#c9d1d8;
  --accent:#1f7a74; --flag:#b7791f; --bad:#b4442f; --win:#2f6db5; --furn:#8a6a4a; --ac:#7a3fb0;
  --f-bed:#e8eef4; --f-wet:#dcecf0; --f-kit:#f3e7dc; --f-liv:#f4f5ef; --f-puja:#f6edd2; --f-core:#e3e5e8; --f-bal:#eef4ea; --f-svc:#ebe8f1; --f-circ:#f8f8f8;
  --display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171c; --sheet:#182027; --ink:#e3e8ec; --muted:#9aa8b3; --rule:#34414c; --accent:#4cb8ae; --flag:#e0a84a; --bad:#e2735d; --win:#7fb0ef; --furn:#c9a882; --ac:#c39be8;
  --f-bed:#1f2c38; --f-wet:#1b3238; --f-kit:#352a20; --f-liv:#222820; --f-puja:#3a3220; --f-core:#2a3037; --f-bal:#22301f; --f-svc:#2a2635; --f-circ:#1c2329; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --sheet:#182027; --ink:#e3e8ec; --muted:#9aa8b3; --rule:#34414c; --accent:#4cb8ae; --flag:#e0a84a; --bad:#e2735d; --win:#7fb0ef; --furn:#c9a882; --ac:#c39be8;
  --f-bed:#1f2c38; --f-wet:#1b3238; --f-kit:#352a20; --f-liv:#222820; --f-puja:#3a3220; --f-core:#2a3037; --f-bal:#22301f; --f-svc:#2a2635; --f-circ:#1c2329; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:24px 48px;padding-inline:16px;display:grid;gap:20px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px}
header.tb{display:grid;grid-template-columns:1fr auto;gap:12px 24px;padding:18px 20px;align-items:end}
h1{font-family:var(--display);font-weight:600;font-size:1.7rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.92rem;max-width:80ch}
.meta{display:grid;grid-template-columns:repeat(4,auto);gap:2px 18px;font-family:var(--mono);font-size:.78rem}
.meta dt{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.68rem}.meta dd{margin:0}
.status{color:var(--flag);font-weight:500}
.sechead{padding:16px 20px 4px;display:grid;gap:4px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1rem;margin:0 0 6px}
.lead{margin:0;max-width:80ch;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 20px;font-size:.88rem}
.controls label{display:flex;gap:6px;align-items:center;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent)} input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plan{overflow-x:auto;border-top:1px solid var(--rule)}
.plan svg{display:block;width:100%;min-width:760px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 20px 16px;font-size:.8rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border:1px solid var(--rule);display:inline-block}
.body{padding:16px 20px 20px;display:grid;gap:16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px}.cols>div{min-width:0}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.83rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--display);font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:.72rem}
td.num,th.num{text-align:right;font-family:var(--mono);white-space:nowrap}
td.tag{font-family:var(--mono);font-weight:500}
tfoot td{font-weight:600;border-bottom:none}
.ok{color:var(--accent);font-weight:500}.fl{color:var(--flag);font-weight:500}.no{color:var(--bad);font-weight:600}
.track{display:grid;gap:0;border-top:1px solid var(--rule)}
.track div{display:grid;grid-template-columns:4.5rem 1fr auto;gap:12px;padding:8px 20px;border-bottom:1px solid var(--rule);font-size:.88rem;align-items:baseline}
.track div:last-child{border-bottom:none}
.track code{font-family:var(--mono);color:var(--muted)}
.pill{font-family:var(--mono);font-size:.72rem;padding:1px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.rules{border:1px solid var(--accent);border-radius:4px;padding:10px 14px;display:grid;gap:4px;font-size:.88rem}
.rules b{font-family:var(--display)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.tcard{border:1px solid var(--rule);border-radius:4px;padding:10px;display:grid;gap:6px;align-content:start;min-width:0}
.tcard h4{font-family:var(--display);font-weight:600;font-size:.95rem;margin:0}
.tcard p{margin:0;font-size:.78rem;color:var(--muted)}
.tcard svg{width:100%;height:auto;display:block}
ul.notes{margin:0;padding-left:1.1rem;display:grid;gap:6px;max-width:82ch}
@media (max-width:640px){header.tb{grid-template-columns:1fr}.meta{grid-template-columns:repeat(2,auto)}.track div{grid-template-columns:3.5rem 1fr}.track .pill{grid-column:2}}
</style><rect fill="var(--sheet)" height="295.2" stroke="var(--ink)" stroke-width="2" width="926.5999999999999" x="30" y="46"></rect><line stroke="var(--rule)" stroke-dasharray="6 4" x1="493.29999999999995" x2="493.29999999999995" y1="46" y2="341.2"></line><text fill="var(--muted)" font-family="var(--mono)" font-size="8.5" text-anchor="middle" x="243.2" y="38">FLAT-01 BLOCK (WEST) TERRACE</text><text fill="var(--muted)" font-family="var(--mono)" font-size="8.5" text-anchor="middle" x="743.4" y="38">FLAT-02 BLOCK (EAST) TERRACE</text><rect fill="var(--f-core)" height="65.6" stroke="var(--rule)" width="57.39999999999999" x="464.59999999999997" y="46"></rect><text fill="var(--muted)" font-family="var(--mono)" font-size="7.5" text-anchor="middle" x="493.29999999999995" y="81.8">LIFT OVERRUN</text><rect fill="var(--f-core)" height="110.69999999999999" stroke="var(--rule)" width="57.39999999999999" x="464.59999999999997" y="230.49999999999997"></rect><text fill="var(--muted)" font-family="var(--mono)" font-size="7.5" text-anchor="middle" x="493.29999999999995" y="288.84999999999997">STAIR / HEADROOM</text><polyline fill="none" points="64.02946194225721,264.12 64.02946194225721,58.3 185.79999999999998,58.3" stroke="var(--accent)" stroke-width="2.4"></polyline><polyline fill="none" points="43.12,58.3 64.02946194225721,58.3" stroke="var(--accent)" stroke-width="2.4"></polyline><polyline fill="none" points="64.02946194225721,339.4480839895013 64.02946194225721,324.79999999999995 286.65999999999997,324.79999999999995" stroke="var(--accent)" stroke-width="2.4"></polyline><polyline fill="none" points="174.32,324.79999999999995 64.02946194225721,324.79999999999995" stroke="var(--accent)" stroke-width="2.4"></polyline><polyline fill="none" points="286.65999999999997,324.79999999999995 407.2,324.79999999999995" stroke="var(--accent)" stroke-width="2.4"></polyline><line stroke="var(--accent)" stroke-width="2.4" x1="43.12" x2="43.12" y1="58.3" y2="42.31"></line><circle cx="43.12" cy="42.31" fill="var(--accent)" r="4"></circle><line stroke="var(--accent)" stroke-width="2.4" x1="185.79999999999998" x2="185.79999999999998" y1="58.3" y2="42.31"></line><circle cx="185.79999999999998" cy="42.31" fill="var(--accent)" r="4"></circle><line stroke="var(--accent)" stroke-width="2.4" x1="174.32" x2="174.32" y1="324.79999999999995" y2="344.89"></line><circle cx="174.32" cy="344.89" fill="var(--accent)" r="4"></circle><line stroke="var(--accent)" stroke-width="2.4" x1="286.65999999999997" x2="286.65999999999997" y1="324.79999999999995" y2="344.89"></line><circle cx="286.65999999999997" cy="344.89" fill="var(--accent)" r="4"></circle><line stroke="var(--accent)" stroke-width="2.4" x1="407.2" x2="407.2" y1="324.79999999999995" y2="341.2"></line><circle cx="407.2" cy="341.2" fill="var(--accent)" r="4"></circle><polyline fill="none" points="123.88838582677165,339.4480839895013 123.88838582677165,331.35999999999996 407.2,331.35999999999996 407.2,341.2" stroke="var(--bad)" stroke-width="2.4"></polyline><rect fill="var(--bad)" height="8" width="8" x="403.2" y="337.2"></rect><rect fill="var(--sheet)" height="75.32808398950131" stroke="var(--win)" stroke-width="2" width="119.71784776902886" x="34.1" y="264.12"></rect><line stroke="var(--win)" stroke-width="1.5" x1="93.95892388451443" x2="93.95892388451443" y1="264.12" y2="339.4480839895013"></line><text fill="var(--win)" font-family="var(--mono)" font-size="7.5" font-weight="700" text-anchor="middle" x="64.02946194225721" y="301.7840419947506">BORE 7.5 kL</text><text fill="var(--bad)" font-family="var(--mono)" font-size="7.5" font-weight="700" text-anchor="middle" x="123.88838582677165" y="301.7840419947506">MUNI 7.5 kL</text><text fill="var(--win)" font-family="var(--mono)" font-size="7.5" text-anchor="start" x="36.1" y="260.12">OHT-W 15 kL · outside 4.45 × 2.80 m</text><polyline fill="none" points="560.1294619422571,264.12 560.1294619422571,58.3 695.8399999999999,58.3" stroke="var(--flag)" stroke-width="2.4"></polyline><polyline fill="none" points="638.4399999999999,58.3 560.1294619422571,58.3" stroke="var(--flag)" stroke-width="2.4"></polyline><polyline fill="none" points="649.9178477690289,296.09999999999997 890.9999999999999,296.09999999999997" stroke="var(--flag)" stroke-width="2.4"></polyline><line stroke="var(--flag)" stroke-width="2.4" x1="638.4399999999999" x2="638.4399999999999" y1="58.3" y2="42.31"></line><circle cx="638.4399999999999" cy="42.31" fill="var(--flag)" r="4"></circle><line stroke="var(--flag)" stroke-width="2.4" x1="695.8399999999999" x2="695.8399999999999" y1="58.3" y2="42.31"></line><circle cx="695.8399999999999" cy="42.31" fill="var(--flag)" r="4"></circle><line stroke="var(--flag)" stroke-width="2.4" x1="713.06" x2="713.06" y1="296.09999999999997" y2="344.89"></line><circle cx="713.06" cy="344.89" fill="var(--flag)" r="4"></circle><line stroke="var(--flag)" stroke-width="2.4" x1="890.9999999999999" x2="890.9999999999999" y1="296.09999999999997" y2="344.89"></line><circle cx="890.9999999999999" cy="344.89" fill="var(--flag)" r="4"></circle><polyline fill="none" points="619.9883858267717,339.4480839895013 619.9883858267717,331.35999999999996 890.9999999999999,331.35999999999996 890.9999999999999,341.2" stroke="var(--bad)" stroke-width="2.4"></polyline><rect fill="var(--bad)" height="8" width="8" x="886.9999999999999" y="337.2"></rect><rect fill="var(--sheet)" height="75.32808398950131" stroke="var(--win)" stroke-width="2" width="119.71784776902891" x="530.1999999999999" y="264.12"></rect><line stroke="var(--win)" stroke-width="1.5" x1="590.0589238845145" x2="590.0589238845145" y1="264.12" y2="339.4480839895013"></line><text fill="var(--win)" font-family="var(--mono)" font-size="7.5" font-weight="700" text-anchor="middle" x="560.1294619422571" y="301.7840419947506">BORE 7.5 kL</text><text fill="var(--bad)" font-family="var(--mono)" font-size="7.5" font-weight="700" text-anchor="middle" x="619.9883858267717" y="301.7840419947506">MUNI 7.5 kL</text><text fill="var(--win)" font-family="var(--mono)" font-size="7.5" text-anchor="start" x="532.1999999999999" y="260.12">OHT-E 15 kL · outside 4.45 × 2.80 m</text><polyline fill="none" points="480.99999999999994,193.6 76.32946194225721,193.6 76.32946194225721,264.12" stroke="var(--win)" stroke-dasharray="5 3" stroke-width="1.4"></polyline><polyline fill="none" points="505.59999999999997,193.6 572.4294619422571,193.6 572.4294619422571,264.12" stroke="var(--win)" stroke-dasharray="5 3" stroke-width="1.4"></polyline><polyline fill="none" points="485.91999999999996,205.89999999999998 123.88838582677165,205.89999999999998 123.88838582677165,264.12" stroke="var(--bad)" stroke-dasharray="5 3" stroke-width="1.4"></polyline><polyline fill="none" points="500.67999999999995,205.89999999999998 619.9883858267717,205.89999999999998 619.9883858267717,264.12" stroke="var(--bad)" stroke-dasharray="5 3" stroke-width="1.4"></polyline><polyline fill="none" points="493.29999999999995,218.2 88.62946194225721,218.2 88.62946194225721,264.12 88.62946194225721,218.2 584.7294619422571,218.2 584.7294619422571,264.12" stroke="var(--muted)" stroke-dasharray="2 3" stroke-width="1.4"></polyline><text fill="var(--win)" font-family="var(--mono)" font-size="7.5" text-anchor="middle" x="493.29999999999995" y="232.49999999999997">5 rising mains up the core</text><text fill="var(--muted)" font-family="var(--mono)" font-size="9" text-anchor="start" x="30" y="361.2">Teal / orange: Flat-01 / Flat-02 bore-water headers, ● down-take in each duct.   Red: municipal header, ■ RO down-take in the kitchen duct.</text><text fill="var(--muted)" font-family="var(--mono)" font-size="9" text-anchor="start" x="30" y="375.2">Dashed: rising mains up the core (blue bore, red municipal, grey tanker to both bore compartments).</text><text fill="var(--muted)" font-family="var(--mono)" font-size="10" letter-spacing="2" text-anchor="middle" x="493.29999999999995" y="22">NORTH</text></svg>