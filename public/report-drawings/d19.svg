><text fill="var(--flag)" font-family="var(--mono)" font-size="9" font-weight="600" text-anchor="middle" x="188.60000000000002" y="136">L1</text><circle cx="172.60000000000002" cy="243.00000000000003" fill="none" r="7" stroke="var(--flag)" stroke-width="1.4"></circle><path d="M167.60000000000002 238.00000000000003L177.60000000000002 248.00000000000003M177.60000000000002 238.00000000000003L167.60000000000002 248.00000000000003" stroke="var(--flag)"></path><text fill="var(--flag)" font-family="var(--mono)" font-size="9" font-weight="600" text-anchor="middle" x="188.60000000000002" y="246.00000000000003">L2</text><rect fill="var(--f-svc)" height="66" stroke="var(--ink)" width="66" x="34" y="34"></rect><text fill="var(--ink)" font-family="var(--mono)" font-size="8.5" text-anchor="middle" x="67" y="70">FRIDGE</text><line stroke="var(--win)" stroke-width="5" x1="117.60000000000001" x2="223.20000000000002" y1="339.8" y2="339.8"></line><text fill="var(--win)" font-family="var(--mono)" font-size="9" text-anchor="middle" x="170.4" y="355.8">KW</text><line stroke="var(--sheet)" stroke-width="6" x1="115.4" x2="194.60000000000002" y1="34" y2="34"></line><line stroke="var(--ink)" stroke-width="1.4" x1="115.4" x2="115.4" y1="34" y2="113.2"></line><path d="M115.4 113.2A79.2 79.2 0 0 0 194.60000000000002 34" fill="none" stroke="var(--ink)" stroke-dasharray="3 2"></path><text fill="var(--muted)" font-family="var(--mono)" font-size="9" text-anchor="middle" x="155" y="28">D4 from dining</text><line stroke="var(--sheet)" stroke-width="6" x1="311.20000000000005" x2="311.20000000000005" y1="190.20000000000002" y2="282.6"></line><line stroke="var(--muted)" stroke-dasharray="2 2" x1="311.20000000000005" x2="311.20000000000005" y1="190.20000000000002" y2="282.6"></line><text fill="var(--muted)" font-family="var(--mono)" font-size="8.5" text-anchor="middle" transform="rotate(90 317.20000000000005 236.40000000000003)" x="317.20000000000005" y="236.40000000000003">to utility (D5)</text><text fill="var(--muted)" font-family="var(--mono)" font-size="10" text-anchor="middle" x="172.60000000000002" y="367.8">126″ × 139″ clear</text><path d="M331.20000000000005 22L336.20000000000005 34L331.20000000000005 31L326.20000000000005 34Z" fill="var(--ink)"></path><text fill="var(--ink)" font-family="var(--mono)" font-size="9" font-weight="600" text-anchor="middle" x="331.20000000000005" y="46">N</text></svg>