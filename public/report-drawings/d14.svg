flag)"></path><path d="M99 48.000000000000014L113 48.000000000000014L106 55.000000000000014Z" fill="var(--flag)"></path><text fill="var(--ink)" font-family="var(--display)" font-size="11" font-weight="600" text-anchor="middle" x="106" y="264">Elevation A · North wall (from inside) · 5′</text><line stroke="var(--flag)" stroke-dasharray="1 2" stroke-width="0.5" x1="106" x2="174" y1="48.000000000000014" y2="48.000000000000014"></line><text fill="var(--flag)" font-family="var(--mono)" font-size="9" x="176" y="51.000000000000014">L1 dry-area downlight (FC)</text><line stroke="var(--flag)" stroke-dasharray="1 2" stroke-width="0.5" x1="106" x2="174" y1="48.000000000000014" y2="59.000000000000014"></line><text fill="var(--flag)" font-family="var(--mono)" font-size="9" x="176" y="62.000000000000014">L2 shower downlight IP65</text><line stroke="var(--accent)" stroke-dasharray="1 2" stroke-width="0.5" x1="106" x2="174" y1="55.20000000000001" y2="70.00000000000001"></line><text fill="var(--accent)" font-family="var(--mono)" font-size="9" x="176" y="73.00000000000001">Shower zone, tiles to FC</text><line stroke="var(--win)" stroke-dasharray="1 2" stroke-width="0.5" x1="122.80000000000001" x2="174" y1="63.60000000000002" y2="81.00000000000001"></line><text fill="var(--win)" font-family="var(--mono)" font-size="9" x="176" y="84.00000000000001">V1 ventilator 2′×3′, sill 5′ + exhaust fan</text><line stroke="var(--muted)" stroke-dasharray="1 2" stroke-width="0.5" x1="158.8" x2="174" y1="114.00000000000001" y2="114.00000000000001"></line><text fill="var(--muted)" font-family="var(--mono)" font-size="9" x="176" y="117.00000000000001">Niche 12″×18″×4″, 4′0″–5′6″</text><line stroke="var(--muted)" stroke-dasharray="1 2" stroke-width="0.5" x1="106" x2="174" y1="222" y2="222"></line><text fill="var(--muted)" font-family="var(--mono)" font-size="9" x="176" y="225">Tiles: 600×1200 vertical, accent finish in shower</text><line stroke="var(--accent)" stroke-dasharray="1 2" stroke-width="0.5" x1