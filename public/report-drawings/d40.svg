<svg xmlns="http://www.w3.org/2000/svg" aria-label="Water riser diagram" id="waterRiser" role="img" viewBox="0 0 980 560"><style>
/* Layout: drawing set — title block, phase tracker, one sheet per flat plan, then schedules, areas and Vastu sign-off. */
:root{
  --bg:#f6f7f8; --sheet:#ffffff; --ink:#1d2730; --muted:#5d6b77; --rule:#c9d1d8;
  --accent:#1f7a74; --flag:#b7791f; --bad:#b4442f; --win:#2f6db5; --furn:#8a6a4a; --ac:#7a3fb0;
  --f-bed:#e8eef4; --f-wet:#dcecf0; --f-kit:#f3e7dc; --f-liv:#f4f5ef; --f-puja:#f6edd2; --f-core:#e3e5e8; --f-bal:#eef4ea; --f-svc:#ebe8f1; --f-circ:#f8f8f8;
  --display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171c; --sheet:#182027; --ink:#e3e8ec; --muted:#9aa8b3; --rule:#34414c; --accent:#4cb8ae; --flag:#e0a84a; --bad:#e2735d; --win:#7fb0ef; --furn:#c9a882; --ac:#c39be8;
  --f-bed:#1f2c38; --f-wet:#1b3238; --f-kit:#352a20; --f-liv:#222820; --f-puja:#3a3220; --f-core:#2a3037; --f-bal:#22301f; --f-svc:#2a2635; --f-circ:#1c2329; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --sheet:#182027; --ink:#e3e8ec; --muted:#9aa8b3; --rule:#34414c; --accent:#4cb8ae; --flag:#e0a84a; --bad:#e2735d; --win:#7fb0ef; --furn:#c9a882; --ac:#c39be8;
  --f-bed:#1f2c38; --f-wet:#1b3238; --f-kit:#352a20; --f-liv:#222820; --f-puja:#3a3220; --f-core:#2a3037; --f-bal:#22301f; --f-svc:#2a2635; --f-circ:#1c2329; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:24px 48px;padding-inline:16px;display:grid;gap:20px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px}
header.tb{display:grid;grid-template-columns:1fr auto;gap:12px 24px;padding:18px 20px;align-items:end}
h1{font-family:var(--display);font-weight:600;font-size:1.7rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.92rem;max-width:80ch}
.meta{display:grid;grid-template-columns:repeat(4,auto);gap:2px 18px;font-family:var(--mono);font-size:.78rem}
.meta dt{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.68rem}.meta dd{margin:0}
.status{color:var(--flag);font-weight:500}
.sechead{padding:16px 20px 4px;display:grid;gap:4px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1rem;margin:0 0 6px}
.lead{margin:0;max-width:80ch;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 20px;font-size:.88rem}
.controls label{display:flex;gap:6px;align-items:center;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent)} input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plan{overflow-x:auto;border-top:1px solid var(--rule)}
.plan svg{display:block;width:100%;min-width:760px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 20px 16px;font-size:.8rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border:1px solid var(--rule);display:inline-block}
.body{padding:16px 20px 20px;display:grid;gap:16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px}.cols>div{min-width:0}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.83rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--display);font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:.72rem}
td.num,th.num{text-align:right;font-family:var(--mono);white-space:nowrap}
td.tag{font-family:var(--mono);font-weight:500}
tfoot td{font-weight:600;border-bottom:none}
.ok{color:var(--accent);font-weight:500}.fl{color:var(--flag);font-weight:500}.no{color:var(--bad);font-weight:600}
.track{display:grid;gap:0;border-top:1px solid var(--rule)}
.track div{display:grid;grid-template-columns:4.5rem 1fr auto;gap:12px;padding:8px 20px;border-bottom:1px solid var(--rule);font-size:.88rem;align-items:baseline}
.track div:last-child{border-bottom:none}
.track code{font-family:var(--mono);color:var(--muted)}
.pill{font-family:var(--mono);font-size:.72rem;padding:1px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.rules{border:1px solid var(--accent);border-radius:4px;padding:10px 14px;display:grid;gap:4px;font-size:.88rem}
.rules b{font-family:var(--display)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.tcard{border:1px solid var(--rule);border-radius:4px;padding:10px;display:grid;gap:6px;align-content:start;min-width:0}
.tcard h4{font-family:var(--display);font-weight:600;font-size:.95rem;margin:0}
.tcard p{margin:0;font-size:.78rem;color:var(--muted)}
.tcard svg{width:100%;height:auto;display:block}
ul.notes{margin:0;padding-left:1.1rem;display:grid;gap:6px;max-width:82ch}
@media (max-width:640px){header.tb{grid-template-columns:1fr}.meta{grid-template-columns:repeat(2,auto)}.track div{grid-template-columns:3.5rem 1fr}.track .pill{grid-column:2}}
</style><line stroke="var(--rule)" stroke-width="1.6" x1="60" x2="940" y1="70" y2="70"></line><text fill="var(--muted)" font-family="var(--mono)" font-size="8.5" x="64" y="66">TERRACE (59′)</text><line stroke="var(--rule)" stroke-width="1" x1="60" x2="940" y1="140" y2="140"></line><text fill="var(--muted)" font-family="var(--mono)" font-size="8.5" x="64" y="136">5th FLOOR</text><line stroke="var(--rule)" stroke-width="1" x1="60" x2="940" y1="205" y2="205"></line><text fill="var(--muted)" font-family="var(--mono)" font-size="8.5" x="64" y="201">4th FLOOR</text><line stroke="var(--rule)" stroke-width="1" x1="60" x2="940" y1="270" y2="270"></line><text fill="var(--muted)" font-family="var(--mono)" font-size="8.5" x="64" y="266">3rd FLOOR</text><line stroke="var(--rule)" stroke-width="1" x1="60" x2="940" y1="335" y2="335"></line><text fill="var(--muted)" font-family="var(--mono)" font-size="8.5" x="64" y="331">2nd FLOOR</text><line stroke="var(--rule)" stroke-width="1" x1="60" x2="940" y1="400" y2="400"></line><text fill="var(--muted)" font-family="var(--mono)" font-size="8.5" x="64" y="396">1st FLOOR</text><line stroke="var(--rule)" stroke-width="1.6" x1="60" x2="940" y1="470" y2="470"></line><text fill="var(--muted)" font-family="var(--mono)" font-size="8.5" x="64" y="466">STILT / GROUND</text><rect fill="var(--sheet)" height="44" stroke="var(--win)" stroke-width="2" width="330" x="300" y="12"></rect><line stroke="var(--win)" stroke-width="1.5" x1="465" x2="465" y1="12" y2="56"></line><text fill="var(--accent)" font-family="var(--mono)" font-size="9" font-weight="700" text-anchor="middle" x="382" y="38">BORE 7.5 kL</text><text fill="var(--bad)" font-family="var(--mono)" font-size="9" font-weight="700" text-anchor="middle" x="548" y="38">MUNICIPAL 7.5 kL</text><text fill="var(--muted)" font-family="var(--mono)" font-size="8.5" x="640" y="26">OHT-W 15 kL on 1.5 m staging</text><text fill="var(--muted)" font-family="var(--mono)" font-size="8.5" x="640" y="40">(OHT-E the same)</text><polyline fill="none" points="185,510 185,22 300,22" stroke="var(--win)" stroke-dasharray="5 3" stroke-width="1.6"></polyline><polyline fill="none" points="205,510 205,30 300,30" stroke="var(--win)" stroke-dasharray="5 3" stroke-width="1.6"></polyline><polyline fill="none" points="225,510 225,5 560,5 560,12" stroke="var(--bad)" stroke-dasharray="5 3" stroke-width="1.6"></polyline><text fill="var(--win)" font-family="var(--mono)" font-size="8" text-anchor="end" x="181" y="524">Bore-W</text><text fill="var(--win)" font-family="var(--mono)" font-size="8" text-anchor="middle" x="205" y="524">Tanker</text><text fill="var(--bad)" font-family="var(--mono)" font-size="8" x="229" y="524">Muni-W</text><text fill="var(--win)" font-family="var(--mono)" font-size="8" x="233" y="462">rising mains in the core duct</text><polyline fill="none" points="340,56 340,88 318,88 318,205" stroke="var(--accent)" stroke-dasharray="" stroke-width="2.4"></polyline><circle cx="355" cy="88" fill="var(--sheet)" r="9" stroke="var(--accent)" stroke-width="2"></circle><text fill="var(--accent)" font-family="var(--mono)" font-size="9" font-weight="700" text-anchor="middle" x="355" y="91">B</text><text fill="var(--accent)" font-family="var(--mono)" font-size="8" x="368" y="84">booster (floors 4–5)</text><polyline fill="none" points="400,56 400,100 342,100 342,400" stroke="var(--accent)" stroke-dasharray="" stroke-width="2.4"></polyline><polyline fill="none" points="430,56 430,112 598,112 598,205" stroke="var(--accent)" stroke-dasharray="" stroke-width="2.4"></polyline><circle cx="505" cy="112" fill="var(--sheet)" r="9" stroke="var(--accent)" stroke-width="2"></circle><text fill="var(--accent)" font-family="var(--mono)" font-size="9" font-weight="700" text-anchor="middle" x="505" y="115">B</text><polyline fill="none" points="450,56 450,124 622,124 622,400" stroke="var(--accent)" stroke-dasharray="" stroke-width="2.4"></polyline><polyline fill="none" points="520,56 520,88 692,88 692,205" stroke="var(--bad)" stroke-dasharray="" stroke-width="1.6"></polyline><polyline fill="none" points="560,56 560,100 708,100 708,400" stroke="var(--bad)" stroke-dasharray="" stroke-width="1.6"></polyline><polyline fill="none" points="318,130 400,130" stroke="var(--accent)" stroke-dasharray="" stroke-width="1.4"></polyline><circle cx="318" cy="130" fill="var(--accent)" r="3"></circle><polyline fill="none" points="598,130 650,130" stroke="var(--accent)" stroke-dasharray="" stroke-width="1.4"></polyline><circle cx="598" cy="130" fill="var(--accent)" r="3"></circle><polyline fill="none" points="692,130 760,130" stroke="var(--bad)" stroke-dasharray="" stroke-width="1.2"></polyline><circle cx="692" cy="130" fill="var(--bad)" r="3"></circle><text fill="var(--accent)" font-family="var(--mono)" font-size="8" x="404" y="133">bathroom: WC, health faucet, basin, shower</text><text fill="var(--accent)" font-family="var(--mono)" font-size="8" x="654" y="124">sink, DW, utility</text><text fill="var(--bad)" font-family="var(--mono)" font-size="8" x="764" y="133">RO only</text><polyline fill="none" points="318,195 400,195" stroke="var(--accent)" stroke-dasharray="" stroke-width="1.4"></polyline><circle cx="318" cy="195" fill="var(--accent)" r="3"></circle><polyline fill="none" points="598,195 650,195" stroke="var(--accent)" stroke-dasharray="" stroke-width="1.4"></polyline><circle cx="598" cy="195" fill="var(--accent)" r="3"></circle><polyline fill="none" points="692,195 760,195" stroke="var(--bad)" stroke-dasharray="" stroke-width="1.2"></polyline><circle cx="692" cy="195" fill="var(--bad)" r="3"></circle><polyline fill="none" points="342,260 400,260" stroke="var(--accent)" stroke-dasharray="" stroke-width="1.4"></polyline><circle cx="342" cy="260" fill="var(--accent)" r="3"></circle><polyline fill="none" points="622,260 650,260" stroke="var(--accent)" stroke-dasharray="" stroke-width="1.4"></polyline><circle cx="622" cy="260" fill="var(--accent)" r="3"></circle><polyline fill="none" points="708,260 760,260" stroke="var(--bad)" stroke-dasharray="" stroke-width="1.2"></polyline><circle cx="708" cy="260" fill="var(--bad)" r="3"></circle><text fill="var(--accent)" font-family="var(--mono)" font-size="8" x="404" y="263">bathroom: WC, health faucet, basin, shower</text><text fill="var(--accent)" font-family="var(--mono)" font-size="8" x="654" y="254">sink, DW, utility</text><text fill="var(--bad)" font-family="var(--mono)" font-size="8" x="764" y="263">RO only</text><polyline fill="none" points="342,325 400,325" stroke="var(--accent)" stroke-dasharray="" stroke-width="1.4"></polyline><circle cx="342" cy="325" fill="var(--accent)" r="3"></circle><polyline fill="none" points="622,325 650,325" stroke="var(--accent)" stroke-dasharray="" stroke-width="1.4"></polyline><circle cx="622" cy="325" fill="var(--accent)" r="3"></circle><polyline fill="none" points="708,325 760,325" stroke="var(--bad)" stroke-dasharray="" stroke-width="1.2"></polyline><circle cx="708" cy="325" fill="var(--bad)" r="3"></circle><polyline fill="none" points="342,390 400,390" stroke="var(--accent)" stroke-dasharray="" stroke-width="1.4"></polyline><circle cx="342" cy="390" fill="var(--accent)" r="3"></circle><polyline fill="none" points="622,390 650,390" stroke="var(--accent)" stroke-dasharray="" stroke-width="1.4"></polyline><circle cx="622" cy="390" fill="var(--accent)" r="3"></circle><polyline fill="none" points="708,390 760,390" stroke="var(--bad)" stroke-dasharray="" stroke-width="1.2"></polyline><circle cx="708" cy="390" fill="var(--bad)" r="3"></circle><text fill="var(--accent)" font-family="var(--mono)" font-size="8" transform="rotate(-90 314 175)" x="314" y="175">zone 4–5 1″</text><text fill="var(--accent)" font-family="var(--mono)" font-size="8" transform="rotate(-90 338 335)" x="338" y="335">zone 1–3 1″</text><text fill="var(--accent)" font-family="var(--mono)" font-size="8" transform="rotate(-90 594 175)" x="594" y="175">4–5 1″</text><text fill="var(--accent)" font-family="va