function totals(o = own(), cellar = S.cellar){
 if (o.p === "a"){
  const common = D.a.common[S.spec] * o.share;

  const ind = picked.reduce((s,n)=>s + aFlatCost(A_FLATS.find(f=>f.n===n).t), 0);
  const allInd = A_FLATS.reduce((s,f)=>s + aFlatCost(f.t), 0) * o.share;
  const byShare = !picked.length, ind2 = byShare ? allInd : ind;
  const GA = D.a.gst, cG = common * GA.common[S.spec];
  const iG = byShare ? A_FLATS.reduce((s,f)=>s + aFlatCost(f.t)*GA.types[f.t][S.spec], 0) * o.share : picked.reduce((s,n)=>{ const t=A_FLATS.find(f=>f.n===n).t; return s + aFlatCost(t)*GA.types[t][S.spec]; }, 0);
  return gx({common, ind: ind2, total: common + ind2, picked, allInd, byShare, cG, iG});
 }
 const wingCommon = (D.b.common[S.spec] - (cellar ? 0 : CELLAR_COST)) / 2, common = wingCommon * o.share;
 const pick = bPick(o);
 const ind = 0;
 const GB = D.b.gst, cG = (D.b.common[S.spec]*GB.common[S.spec] - (cellar ? 0 : CELLAR_COST*GB.cellar)) / 2 * o.share;
 const iG = 0;
 return gx({common, ind, total: common + ind, wingCommon, pick, cG, iG, noInd: true});
}

   g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#e6d9c2" stroke="#8a6a4a" stroke-width=".15" stroke-dasharray=".6 .3"><title>${esc(f[0]+" · "+f[2]+" × "+f[3]+" × "+f[4]+" m · "+f[5])}</title></rect><text x="${x+w/2}" y="${y+h+1.1}" font-size=".9" text-anchor="middle" fill="#8a6a4a">${f[0]}</text>`; });

  return `<p class="lead">A reinforced-concrete frame on 32 columns, set out so that every column sits inside a wall upstairs and between the car bays below. The cellar is boxed in by RCC retaining walls. This is the PMC's preliminary design for budgeting; the structural engineer checks and signs every member before construction.</p>

  <h3>Column and footing layout</h3><p class="note">Black = columns (C1–C32, grid lines 1–8 south to north and A–D west to east); dashed = footings below. Hover or tap a column or footing for its size, load and steel.</p>

   return `<p class="lead">Only your own flat: every conduit, electrical point, water line, drain sleeve and the points where the common works hand over to you. North is up. Choose your flat${mine.length?"":" (tick your flats under Your units to see only those)"}.</p>
   <div class="bar"><label class="lab" for="svu">Flat</label><select id="svu">${list.map(n=>{const x=A_FLATS.find(y=>y.n===n);return `<option value="${n}" ${n===cur?"selected":""}>Flat ${n} · ${esc(D.a.types[x.t].label)}</option>`;}).join("")}</select></div>
   ${lay}<div class="svcbox">${svgA(F)}</div>${svcLegend()}
   <div class="cols" style="margin-top:12px"><div class="card"><h3 style="margin-top:0">Points in flat ${cur}</h3><div class="tw"><table><tbody>${svcCounts(F.elec.map(e=>e[0]))}</tbody></table></div></div>
   <div class="card"><h3 style="margin-top:0">Where the common works hand over</h3><ul class="list"><li><b>Electrical:</b> the rising main from your meter ends at your DB position in the ${esc(F.ho.db[4])}; ${F.ho.cps.length} ceiling points with conduit are cast in your slab by SAHA (${F.ho.cps.map(c=>c[1]).join(", ")}).</li><li><b>Water:</b> ${F.ho.wps.length} valves, one in each wet room and the kitchen / utility, fed from the duct down-takes.</li><li><b>Drains:</b> ${(F.ho.sls||[]).length} slab sleeves for WCs, showers, traps and basins, and ${(F.ho.wss||[]).length} wall sleeves for the kitchen and utility, all cast before the pour.</li><li>Your own conduits run about ${Math.round(slabFt)} ft in the slab and false ceiling, plus the wall drops to every switch and socket.</li></ul></div></div>`;
  }
  const w = o.wing, pick = bPick(o), basis = w==="S" ? "HOSTEL-S" : "OFFICE-N";
  const q = D.b.svc.conduit.qty[w];
  const nonBasis = o.units.filter(u=>pick[u]!==basis);
  if (nonBasis.length === o.units.length) { const t = pick[o.units[0]]; return `<p class="lead">Your ${o.units.length>1?"units are":"unit is"} set to ${esc(TYPE_NAME[t])} (${o.units.join(", ")}). Here is that layout for your wing only.</p>${wingPlan(t, w)}<div class="callout">The conduit, electrical-point, water and drainage layout for the ${esc(TYPE_NAME[t])} is drawn and issued to you once you confirm this option, before your floor's slab is poured, because the slab conduits and sleeves are cast to suit it. The common handover points stay the same: a water valve in each wet room from the duct, drain sleeves to the stacks, and the rising main to your DB position.</div>`; }
  return `<p class="lead">Only your wing: the ${w==="S"?"south (plot 93)":"north (plot 78)"} half of the typical floor, with every slab conduit, electrical point, water line, drain, sleeve and stack. The other wing is not shown. The same layout repeats on each of your floors (${o.units.join(", ")}).</p>
  ${nonBasis.length?`<div class="callout">Units ${nonBasis.join(", ")} are set to ${esc(TYPE_NAME[pick[nonBasis[0]]])} in Your units. The drawing shows the ${w==="S"?"hostel":"office"} services; the ${esc(TYPE_NAME[pick[nonBasis[0]]])} services layout is issued once that choice is confirmed, before that floor's slab is poured.</div>`:""}
  ${lay}<div class="svcbox">${svgB(w)}</div>${svcLegend()}
  <div class="cols" style="margin-top:12px"><div class="card"><h3 style="margin-top:0">Per floor</h3><div class="tw"><table><tbody>
   <tr><td>Slab conduit 20 mm</td><td class="n">${Math.round(q.slab20)} ft</td></tr><tr><td>Slab conduit 25 mm</td><td class="n">${Math.round(q.slab25)} ft</td></tr><tr><td>Wall conduit</td><td class="n">${Math.round(q.wall20+q.wall25)} ft</td></tr>${q.floor25?`<tr><td>Floor conduit (floor boxes)</td><td class="n">${Math.round(q.floor25)} ft</td></tr>`:""}${q.data?`<tr><td>Data cable</td><td class="n">${Math.round(q.data)} ft</td></tr>`:""}<tr><td>Ceiling drops cast in the slab</td><td class="n">${q.drops}</td></tr>
   ${svcCounts(D.b.svc.points[w].map(p=>B_PT[p.name]||p.k))}</tbody></table></div></div>
  <div class="card"><h3 style="margin-top:0">Plumbing per floor</h3><ul class="list"><li>${D.b.svc.stacks.filter(s=>s.k[0]===w).length} stacks in the outside ducts: ${D.b.svc.stacks.filter(s=>s.k[0]===w).map(s=>s.k+" ("+s.serves+")").join(", ")}.</li><li>${D.b.svc.valves.filter(v=>w==="S"?v.s<46:v.s>46).length} water valves, one inside each wet room.</li><li>${D.b.svc.sleeves.filter(s=>s.wing===w).length} sleeves through the slab and beams, cast before each pour.</li><li>Electrical riser (rising mains) and low-voltage riser in the core.</li></ul></div></div>`;
 },
 site(){
  if (P()==="a") return `<p class="lead">20 cars under the stilt slab on one east–west drive, 2 per flat; the water tanks, sumps, bore and the electrical room with the meter panel and generator are shown in the interactive set below.</p>
  ${phase2("parking","Scroll down inside the frame for the water system (bore, sumps, overhead tank) and the power system (meter panel, generator).", "parking,water,power,drainage")}`;
  return `<p class="lead">Both parking levels and every site service, drawn on the approved layout. West road at the top, south road on the left, north road on the right, the 77:76 boundary at the bottom.</p>
  ${(()=>{ const OPTS=[["stilt","With cellar · stilt level (20 cars + site services)"],["cellar","With cellar · cellar level (18 cars, ramp)"],["nocellar","Without cellar · stilt only (20 cars + 2 visitor bays)"]]; let v=store.get("lo.lvl"); if(!OPTS.some(o=>o[0]===v)) v = S.cellar ? "stilt" : "nocellar"; if(!S.cellar && v!=="nocellar") v="nocellar"; setTimeout(()=>{const l=document.getElementById("lvlsel"); if(l) l.onchange=()=>{ store.set("lo.lvl",l.value); if(l.value==="nocellar"){S.cellar=false;store.set("lo.cellar","no");} else {S.cellar=true;store.set("lo.cellar","yes");} render(); };},0);
   return `<div class="bar"><label class="lab" for="lvlsel">Drawing</label><select id="lvlsel">${OPTS.map(o=>`<option value="${o[0]}" ${o[0]===v?"selected":""}>${o[1]}</option>`).join("")}</select></div>${v==="nocellar"?`<div class="callout">Without the cellar the ramp strip becomes a paved drive with 2 visitor bays, and the south gate is used for both in and out. Parking: 20 covered cars on the stilt plus 2 visitors. The building cost drops by about ${L(CELLAR_COST)} (see Welcome).</div>`:""}<div class="svcbox">${sitePlan(v)}</div>`; })()}
  <div class="cols" style="margin-top:12px"><div class="card"><h3 style="margin-top:0">Getting in and out</h3><ul class="list"><li><b>Stilt:</b> in by the north gate, along the north drive, down aisle 2 to the west lane, out by the south-west gate; aisle 1 is two-way off the west lane.</li><li><b>Cellar:</b> down the 12′ one-lane ramp from the south road along the east boundary (signals at both ends), into the landing pocket, then aisle 2 and the cross drive to aisle 1.</li><li>No vehicle gate on the west road (it is higher than the site); a pedestrian wicket only, with a retaining wall.</li></ul></div>
  <div class="card"><h3 style="margin-top:0">Site services</h3><ul class="list"><li><b>Water:</b> a bore and a 30 kL sump for each wing under the west lane; HMWSSB meter and tanker inlet at the west wicket fill either sump; pumps on the sump tops; rising mains up ducts S1 / N1 to the overhead tanks on the terrace.</li><li><b>Power:</b> meter room in the core at stilt with the meter panel and each wing's generator changeover; a generator pad for each wing in the north and south strips; a transformer (DTR) pad at the north end of the west setback, needed only if TSSPDCL asks for one.</li><li><b>Security:</b> two watchman rooms, one in the north and one in the south setback, by the gates.</li><li><b>Cellar:</b> channels to a sump pit with two automatic pumps at the ramp foot; exhaust and fresh-air fans with CO sensors.</li></ul></div></div>`;
 },
 pay(){
  const o = own(), a = o.p==="a", T = totals(o), sc = D[o.p].sched;
  const n = sc.months.length;
  const common = sc.common.map(f => f * T.common);
  const ind = Array(n).fill(0);
  if (a && T.byShare) A_FLATS.forEach(f => sc.floor[f.floor].forEach((v,i)=>ind[i] += v * aFlatCost(f.t) * o.share));
  else if (a) T.picked.forEach(fl => { const f = A_FLATS.find(x=>x.n===fl); sc.floor[f.floor].forEach((v,i)=>ind[i] += v * aFlatCost(f.t)); });
  else o.units.forEach(u => { const fl = +u[0], c = D.b.units[T.pick[u]].total; sc.floor[fl].forEach((v,i)=>ind[i] += v * c); });
  const tot = common.map((c,i)=>c+ind[i]); const mx = Math.max(...tot, 1);
  const rc = T.common ? T.cG/T.common : 0, ri = T.ind ? T.iG/T.ind : 0;
  let cum = 0;
  const rows = sc.months.map((m,i)=>{ cum += tot[i]; if (tot[i] < 1) return ""; return `<tr><td><b>${m}</b></td><td class="w">${esc(sc.works[i])}</td><td class="n">${L(common[i]*(1-rc))}</td>${a?`<td class="n">${ind[i]>=1?L(ind[i]*(1-ri)):"—"}</td>`:""}<td class="n">${L(common[i]*rc+ind[i]*ri)}</td><td class="n"><b>${L(tot[i])}</b></td><td style="width:90px"><span class="pbar" style="width:${Math.round(tot[i]/mx*90)}px"></span></td><td class="n">${amt(cum)}</td></tr>`; }).join("");
  const peak = tot.indexOf(Math.max(...tot));
  return `<p class="lead">When ${esc(o.name)} pays, month by month, following the construction programme${a?"":" (counted from the start of work, once the start date is fixed)"}. Each amount is requested at the start of the stage it pays for, in proportion to ${a?"your share":"your share of your wing's common works"}.</p>
  ${specToggle()}
  <div class="figs"><div class="fig"><div class="l">Cost to be paid</div><div class="v">${amt(T.X)}</div><div class="s">+ GST ${amt(T.G)} = ${amt(T.total)} incl. GST${a?"":" · common works only"}</div></div><div class="fig"><div class="l">Busiest month</div><div class="v">${L(tot[peak])}</div><div class="s">${sc.months[peak]}</div></div><div class="fig"><div class="l">Spread over</div><div class="v">${tot.filter(x=>x>=1).length} months</div><div class="s">${sc.months.find((m,i)=>tot[i]>=1)} to ${sc.months[tot.length-1-[...tot].reverse().findIndex(x=>x>=1)]}</div></div></div>
  ${a && T.byShare ? `<div class="callout">Flats are not allotted yet, so the individual works of all 10 flats are included at your share (${Math.round(o.share*100)}%). They fall in the months after each floor is handed over as a shell.</div>` : ""}
  <div class="tw"><table><thead><tr><th>${a?"Month":"Period"}</th><th>Work on site</th><th class="n">Common share · cost</th>${a?`<th class="n">Your flats · cost</th>`:""}<th class="n">GST</th><th class="n">To pay incl. GST</th><th></th><th class="n">Paid to date</th></tr></thead><tbody>${rows}<tr class="tot"><td>Total</td><td></td><td class="n">${amt(T.cX)}</td>${a?`<td class="n">${amt(T.iX)}</td>`:""}<td class="n">${amt(T.G)}</td><td class="n">${amt(T.total)}</td><td></td><td></td></tr></tbody></table></div>
  <h3>How the requests work</h3>
  <ul class="list"><li>Before each stage starts, the PMC raises one payment request per owner for that stage's budget (material, machinery, labour), split by ${a?"each landowner's percentage":"wing and by each owner's percentage"}.</li><li>After the stage, the actual cost is approved by the PMC and shared with you; a saving is credited to your next request and a shortfall is added to it.</li><li>${a?"Your flat's individual works are requested floor by floor, from the month that floor is handed over as a shell until the finishes are complete.":"Each floor is handed over to you as a finished shell (see the handover checklist under Who does what); the works inside are yours to plan from that month."}</li><li>The months follow the planned programme; if the site runs ahead or behind, the requests move with it.</li></ul>`;
 },
 scope(){
  const a = P()==="a";
  const rows = a ? D.a.matrix : D.b.who;
  return `<p class="lead">Where the common works stop and your own works start. SAHA hands each floor over as a finished shell: slabs, common walls plastered, windows fixed, toilet floors waterproofed and ponded, water valves and drain sleeves in place, ceiling points cast and the rising main at your DB.</p>
  <div class="tw"><table><thead><tr><th>Trade</th><th>SAHA · common works</th><th>Owner · individual works</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>
  <h3>Timeline</h3>
  ${a ? `<div class="tw"><table><thead><tr><th>Milestone</th><th class="n">Expected</th></tr></thead><tbody><tr><td>Ground work starts</td><td class="n">15 Jan 2027</td></tr>${D.a.shell.map(r=>`<tr><td>${/^Floor/.test(r[0])?r[0]+" shell ready for the owner's works":esc(r[0])}</td><td class="n">${r[1]}</td></tr>`).join("")}</tbody></table></div>` : `<ul class="list"><li>About 69 weeks of construction in 37 stages after approvals and soil investigation.</li><li>Shell handover to the owners floor by floor from about week 47.</li><li>The use of each floor (hostel, office, 3BHK or 4BHK) is decided before that floor's slab pour.</li></ul>`}
  <h3>What we need from you</h3>
  <ul class="list"><li>${a?"Confirm the allotment of flats so each owner's individual works can be priced to their flats.":"Confirm the use of each floor (hostel / office / 3BHK / 4BHK), and whether to keep the cellar."}</li><li>Any changes of make or finish inside your ${a?"flat":"units"} (a different main door, tile or fitting) before the dealers' quotes are closed.</li><li>Approval of the common-works budget so the first stage can be requested.</li></ul>`;
 }
};

S.ch = (() => { const h = (location.hash||"").slice(1); if (CH_ALL.some(c=>c[0]===h)) return h; const s = store.get("lo.ch"); return CH_ALL.some(c=>c[0]===s) ? s : "welcome"; })();
header(); render();
</script>
